spring:
  application:
    name: jobpilot
  profiles:
    default: local

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jobpilot:
  ai:
    chat-model: ${JOBPILOT_AI_CHAT_MODEL:deepseek-chat}
    max-iterations: ${JOBPILOT_AI_MAX_ITERATIONS:5}
  security:
    # 不提供默认密钥：JWT 密钥必须通过环境变量注入，避免把可伪造令牌的密钥提交进 git。
    jwt-secret: ${JOBPILOT_SECURITY_JWT_SECRET:}
    jwt-issuer: ${JOBPILOT_SECURITY_JWT_ISSUER:jobpilot}
    access-token-ttl: ${JOBPILOT_SECURITY_ACCESS_TOKEN_TTL:PT2H}
    bcrypt-strength: ${JOBPILOT_SECURITY_BCRYPT_STRENGTH:10}
    public-paths:
      - /api/v1/health
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /actuator/health
  rag:
    ollama-base-url: ${JOBPILOT_RAG_OLLAMA_URL:http://localhost:11434}
    embedding-model: ${JOBPILOT_RAG_EMBEDDING_MODEL:bge-m3}
    chat-model: ${JOBPILOT_RAG_CHAT_MODEL:qwen2.5:3b}
    chroma-base-url: ${JOBPILOT_RAG_CHROMA_URL:http://localhost:8000}
    chroma-collection: ${JOBPILOT_RAG_CHROMA_COLLECTION:jobpilot_chunks}
    # 0.6.x REST 无法按名获取已有集合，重启后保持集合不变靠这个固定 UUID
    chroma-collection-id: ${JOBPILOT_RAG_CHROMA_COLLECTION_ID:}
    chunk-size: 500
    chunk-overlap: 100
    top-k: 5
    similarity-threshold: 0.45
    keyword-min-hits: 2   # 降级检索：至少命中 N 个不同关键词才算证据；待评测集校准
