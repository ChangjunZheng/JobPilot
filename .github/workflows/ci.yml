name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: jobpilot
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # A test that only passes because the architecture checker was never run is
      # not a passing test. Run it before the suite so a boundary violation is
      # reported as itself rather than buried under test output.
      - name: Architecture constraints
        run: bash scripts/check-arch.sh

      # JobPilotApplicationTests is a full @SpringBootTest that boots Flyway
      # against a real MySQL, so the service container above is required.
      #
      # These must be the standard SPRING_DATASOURCE_* property names. The
      # datasource URL otherwise lives only in application-local.yml, which is
      # gitignored and therefore absent on CI — a non-standard variable name
      # would bind to nothing and the context would fail to start.
      #
      # Chroma and Ollama are deliberately absent: the vector store is treated
      # as unreachable (warn, keep keyword fallback) and startup still succeeds.
      - name: Tests
        run: ./mvnw -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/jobpilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ci-root
          SPRING_FLYWAY_ENABLED: 'true'
          JOBPILOT_SECURITY_JWT_SECRET: ci-only-secret-must-be-at-least-32-bytes-long-12345
          JOBPILOT_SECURITY_JWT_ISSUER: jobpilot
